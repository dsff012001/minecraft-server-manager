plugins {
  id 'java'
  id 'net.neoforged.moddev' version '2.0.107'
}

version = '1.0.0'
base { archivesName = 'blockctrl-tracker-neoforge' }

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge { version = '21.1.77' }

runs { server { server() } }

repositories { mavenCentral() }

dependencies { }

jar { manifest { attributes(['Implementation-Title': 'BlockCtrl Tracker', 'Implementation-Version': project.version]) } }

sourceSets.main.resources.srcDir 'src/main/generated'
